[project]
name = "predict-data-portal"
version = "1.0.0"
description = "Build tool for the PREDICT data-portal HTML and Excel files."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.1",
    "jinja2>=3.1.4",
    "markdown>=3.6",
    "pymdown-extensions>=10.5",
    "openpyxl>=3.1.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "types-pyyaml",
    "types-openpyxl",
    "types-Markdown",
]

[project.scripts]
build-portal = "build:main"

# ── Ruff ──────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py310"
line-length = 79

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print (no print statements)
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # Ruff-specific rules
    "D",    # pydocstyle (Google convention)
]
ignore = [
    "D100",   # missing docstring in public module (we have one)
    "D104",   # missing docstring in public package
    "S603",   # subprocess call – check for untrusted input (reviewed)
    "S607",   # starting a process with a partial executable path (reviewed)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]

[tool.ruff.lint.isort]
known-first-party = ["build"]

# ── Mypy ──────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "markdown.*",
]
ignore_missing_imports = true
